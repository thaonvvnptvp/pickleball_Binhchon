<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bình Chọn Lịch Thể Thao Hàng Ngày</title>
    <!-- Tailwind CSS qua CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        zalo: {
                            DEFAULT: '#0068ff',
                            hover: '#0052cc',
                            light: '#e5f0ff',
                            dark: '#003b99'
                        }
                    }
                }
            }
        }
    </script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f3f4f6;
        }
        .option-card {
            transition: all 0.2s ease-in-out;
            -webkit-tap-highlight-color: transparent;
        }
        .option-card:active {
            transform: scale(0.99);
        }
    </style>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-3 sm:p-4">

    <!-- KHUNG CARD BÌNH CHỌN CHÍNH -->
    <div class="w-full max-w-md bg-white rounded-2xl shadow-xl border border-gray-100 overflow-hidden">
        
        <!-- HEADER -->
        <div class="bg-zalo text-white p-4 relative" style="background-color: #0068ff;">
            <div class="flex justify-between items-start">
                <div>
                    <span class="inline-block bg-white/20 text-xs px-2.5 py-0.5 rounded-full font-medium mb-1 backdrop-blur-sm" id="dateBadge">
                        Đang tải ngày...
                    </span>
                    <h1 class="text-xl font-bold tracking-tight">Hôm nay có ai chơi?</h1>
                </div>
                <button onclick="changeUserNamePrompt()" title="Đổi tên người dùng" class="text-white/80 hover:text-white p-1 rounded-lg hover:bg-white/10 transition">
                    <i class="fa-solid fa-user-gear text-lg">⚙️</i>
                </button>
            </div>
            
            <div class="mt-3 pt-3 border-t border-white/15 flex justify-between items-center text-xs text-white/90">
                <div class="flex items-center gap-1.5">
                    <i class="fa-regular fa-user-circle text-sm">👤</i>
                    <span>Tạo bởi: <strong id="currentUserDisplay">...</strong></span>
                </div>
                <div class="flex items-center gap-1.5 font-medium bg-black/10 px-2 py-1 rounded">
                    <i class="fa-regular fa-clock">⏰</i>
                    <span id="pollStatusText">Đang kiểm tra...</span>
                </div>
            </div>
        </div>

        <!-- CẢNH BÁO TRẠNG THÁI (Nếu đóng hoặc chưa mở) -->
        <div id="statusBanner" class="hidden p-3 bg-amber-50 border-b border-amber-100 text-amber-800 text-xs flex items-center gap-2">
            <span class="flex-shrink-0">ℹ️</span>
            <span id="statusBannerText">Thông báo trạng thái bình chọn</span>
        </div>

        <!-- DANH SÁCH LỰA CHỌN (OPTIONS) -->
        <div class="p-4">
            <p class="text-xs font-semibold text-gray-500 uppercase tracking-wider mb-3">CHỌN 1 KHUNG GIỜ PHÙ HỢP VỚI BẠN:</p>
            <div id="optionsContainer" class="space-y-2.5">
                <!-- Javascript sẽ render động các lựa chọn vào đây -->
            </div>

            <!-- NÚT XÁC NHẬN BÌNH CHỌN -->
            <div class="mt-5 space-y-2">
                <button id="btnSubmitVote" onclick="submitVote()" disabled 
                    class="w-full py-3 px-4 bg-zalo hover:bg-zalo-hover disabled:bg-gray-300 disabled:cursor-not-allowed text-white font-semibold rounded-xl shadow-md transition-all duration-200 flex items-center justify-center gap-2" style="background-color: #0068ff;">
                    <span>✓</span>
                    <span>Xác nhận bình chọn</span>
                </button>
            </div>
        </div>

        <!-- KHU VỰC THỐNG KÊ CHI TIẾT (DANH SÁCH NGƯỜI THAM GIA) -->
        <div class="border-t border-gray-100 bg-slate-50 p-4">
            <div class="flex justify-between items-center mb-3">
                <h2 class="text-sm font-bold text-gray-800 flex items-center gap-1.5">
                    <span class="text-zalo">📊</span>
                    Danh sách chi tiết
                </h2>
                <span class="text-xs font-medium bg-blue-100 text-blue-600 px-2 py-0.5 rounded-full" id="totalVotesBadge">
                    Tổng: 0 lượt
                </span>
            </div>
            
            <div id="votersDetailContainer" class="space-y-2 text-xs">
                <!-- Javascript sẽ render danh sách người chọn từng option vào đây -->
            </div>
        </div>
        
    </div>

    <!-- MODAL ĐỊNH DANH (NHẬP TÊN LẦN ĐẦU) -->
    <div id="nameModal" class="fixed inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4 z-50 hidden">
        <div class="bg-white rounded-2xl max-w-sm w-full p-5 shadow-2xl space-y-4">
            <div class="text-center">
                <div class="w-12 h-12 bg-blue-100 text-blue-600 rounded-full flex items-center justify-center mx-auto mb-2 text-xl">
                    👤
                </div>
                <h3 class="text-lg font-bold text-gray-900">Nhập tên của bạn</h3>
                <p class="text-xs text-gray-500 mt-1">Vui lòng nhập Họ tên hoặc Biệt danh để mọi người trong nhóm nhận biết khi bạn bình chọn.</p>
            </div>
            
            <form onsubmit="saveUserName(event)" class="space-y-3">
                <input type="text" id="inputUserName" required placeholder="Ví dụ: Nguyễn Văn A (A.Sơn)" 
                    class="w-full px-3.5 py-2.5 border border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm">
                
                <button type="submit" class="w-full py-2.5 bg-blue-600 hover:bg-blue-700 text-white font-medium rounded-xl text-sm transition">
                    Lưu & Tiếp tục
                </button>
            </form>
        </div>
    </div>

    <!-- JAVASCRIPT LOGIC -->
    <script>
        // CẤU HÌNH NGÀY LỄ CỐ ĐỊNH (YYYY-MM-DD)
        const HOLIDAYS = [
            "2026-01-01", 
            "2026-04-30", 
            "2026-05-01", 
            "2026-09-02"
        ];

        let currentUser = '';
        try {
            currentUser = localStorage.getItem('voter_name') || '';
        } catch(e) {
            console.warn('LocalStorage not accessible', e);
        }

        let selectedOptionIndex = null;
        let isPollOpen = false;
        let todayKey = '';
        let pollSchedule = {
            options: [],
            closeTimeStr: '',
            isHolidayOrWeekend: false
        };

        // KHỞI TẠO TỰ ĐỘNG CHẠY NGAY
        function initApp() {
            calculateDailySchedule();
            checkUserIdentity();
            loadVotesData();
            renderOptions();
            renderVotersDetail();
        }

        function calculateDailySchedule() {
            const now = new Date();
            
            const year = now.getFullYear();
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const date = String(now.getDate()).padStart(2, '0');
            todayKey = `voting_data_${year}-${month}-${date}`;

            const dayOfWeekStr = ['Chủ Nhật', 'Thứ 2', 'Thứ 3', 'Thứ 4', 'Thứ 5', 'Thứ 6', 'Thứ 7'][now.getDay()];
            document.getElementById('dateBadge').innerText = `${dayOfWeekStr}, ${date}/${month}/${year}`;

            const dateStr = `${year}-${month}-${date}`;
            const isWeekend = (now.getDay() === 0 || now.getDay() === 6);
            const isHoliday = HOLIDAYS.includes(dateStr);
            const isSpecialDay = isWeekend || isHoliday;

            pollSchedule.isHolidayOrWeekend = isSpecialDay;

            if (isSpecialDay) {
                pollSchedule.options = ["16h00", "16h30", "17h00", "17h30", "Nghỉ"];
                pollSchedule.closeTimeStr = "16:00";
            } else {
                pollSchedule.options = ["17h00", "17h30", "18h00", "Nghỉ"];
                pollSchedule.closeTimeStr = "17:00";
            }

            const openTime = new Date(now);
            openTime.setHours(9, 0, 0, 0);

            const closeTime = new Date(now);
            const [cHour, cMin] = pollSchedule.closeTimeStr.split(':');
            closeTime.setHours(parseInt(cHour), parseInt(cMin), 0, 0);

            const statusText = document.getElementById('pollStatusText');
            const statusBanner = document.getElementById('statusBanner');
            const statusBannerText = document.getElementById('statusBannerText');

            if (now < openTime) {
                isPollOpen = false;
                statusText.innerText = "Mở lúc 09:00";
                statusBanner.classList.remove('hidden');
                statusBannerText.innerText = "Bình chọn sẽ chính thức mở lúc 09:00 sáng nay.";
            } else if (now > closeTime) {
                isPollOpen = false;
                statusText.innerText = "Đã hết giờ";
                statusBanner.classList.remove('hidden');
                statusBannerText.innerText = `Đã hết giờ bình chọn (Kết thúc lúc ${pollSchedule.closeTimeStr} hàng ngày).`;
            } else {
                isPollOpen = true;
                statusText.innerText = `Đóng lúc ${pollSchedule.closeTimeStr}`;
                statusBanner.classList.add('hidden');
            }
        }

        function checkUserIdentity() {
            if (!currentUser) {
                document.getElementById('nameModal').classList.remove('hidden');
                document.getElementById('currentUserDisplay').innerText = 'Chưa nhận diện';
            } else {
                document.getElementById('nameModal').classList.add('hidden');
                document.getElementById('currentUserDisplay').innerText = currentUser;
            }
        }

        function saveUserName(e) {
            e.preventDefault();
            const inputVal = document.getElementById('inputUserName').value.trim();
            if (inputVal) {
                currentUser = inputVal;
                try {
                    localStorage.setItem('voter_name', currentUser);
                } catch(e){}
                document.getElementById('currentUserDisplay').innerText = currentUser;
                document.getElementById('nameModal').classList.add('hidden');
                
                loadVotesData();
                renderOptions();
                renderVotersDetail();
            }
        }

        function changeUserNamePrompt() {
            const newName = prompt("Nhập tên mới của bạn:", currentUser || '');
            if (newName && newName.trim() !== '') {
                currentUser = newName.trim();
                try {
                    localStorage.setItem('voter_name', currentUser);
                } catch(e){}
                document.getElementById('currentUserDisplay').innerText = currentUser;
                loadVotesData();
                renderOptions();
                renderVotersDetail();
            }
        }

        function getVotesData() {
            try {
                const dataStr = localStorage.getItem(todayKey);
                if (dataStr) {
                    return JSON.parse(dataStr);
                }
            } catch(e){}
            return pollSchedule.options.map(() => []);
        }

        function saveVotesData(data) {
            try {
                localStorage.setItem(todayKey, JSON.stringify(data));
            } catch(e){}
        }

        function loadVotesData() {
            if (!currentUser) return;
            const votesData = getVotesData();
            selectedOptionIndex = null;
            votesData.forEach((voters, optIdx) => {
                if (voters.includes(currentUser)) {
                    selectedOptionIndex = optIdx;
                }
            });
        }

        function renderOptions() {
            const container = document.getElementById('optionsContainer');
            const votesData = getVotesData();
            const totalVotes = votesData.reduce((acc, curr) => acc + curr.length, 0);

            container.innerHTML = pollSchedule.options.map((option, idx) => {
                const voteCount = votesData[idx] ? votesData[idx].length : 0;
                const isSelected = selectedOptionIndex === idx;
                const percent = totalVotes > 0 ? Math.round((voteCount / totalVotes) * 100) : 0;

                return `
                    <div onclick="handleSelectOption(${idx})" 
                        class="option-card relative flex items-center justify-between p-3.5 border rounded-xl cursor-pointer overflow-hidden select-none ${
                            isSelected 
                                ? 'border-blue-600 bg-blue-50 ring-1 ring-blue-600' 
                                : 'border-gray-200 bg-white hover:border-gray-300'
                        } ${!isPollOpen ? 'opacity-75 cursor-not-allowed' : ''}">
                        
                        <div class="absolute left-0 top-0 bottom-0 bg-blue-100/60 transition-all duration-300 -z-0" style="width: ${percent}%"></div>

                        <div class="flex items-center gap-3 relative z-10">
                            <div class="w-5 h-5 rounded-full border-2 flex items-center justify-center transition-all ${
                                isSelected ? 'border-blue-600 bg-blue-600' : 'border-gray-300 bg-white'
                            }">
                                ${isSelected ? '<span class="text-white text-xs">✓</span>' : ''}
                            </div>
                            
                            <span class="font-semibold text-sm ${isSelected ? 'text-blue-600' : 'text-gray-800'}">
                                ${option}
                            </span>
                        </div>

                        <div class="relative z-10 flex items-center gap-1">
                            <span class="text-xs font-bold ${isSelected ? 'text-blue-600' : 'text-gray-600'}">
                                ${voteCount}
                            </span>
                            <span class="text-[11px] text-gray-400">lượt</span>
                        </div>
                    </div>
                `;
            }).join('');

            const btnSubmit = document.getElementById('btnSubmitVote');
            if (isPollOpen && selectedOptionIndex !== null) {
                btnSubmit.disabled = false;
                btnSubmit.classList.remove('bg-gray-300');
                btnSubmit.classList.add('bg-blue-600');
            } else {
                btnSubmit.disabled = true;
                btnSubmit.classList.add('bg-gray-300');
                btnSubmit.classList.remove('bg-blue-600');
            }
        }

        function renderVotersDetail() {
            const container = document.getElementById('votersDetailContainer');
            const votesData = getVotesData();
            let totalVotes = 0;

            const html = pollSchedule.options.map((option, idx) => {
                const voters = votesData[idx] || [];
                totalVotes += voters.length;

                if (voters.length === 0) {
                    return `
                        <div class="bg-white p-2.5 rounded-lg border border-gray-100 flex justify-between items-center text-gray-400">
                            <span class="font-medium">${option}:</span>
                            <span class="italic text-[11px]">Chưa có ai chọn</span>
                        </div>
                    `;
                }

                const namesText = voters.map(name => {
                    const isMe = name === currentUser;
                    return `<span class="inline-block bg-slate-100 text-gray-700 font-medium px-2 py-0.5 rounded border border-slate-200 ${isMe ? 'border-blue-400 text-blue-600 font-semibold' : ''}">${name}${isMe ? ' (Bạn)' : ''}</span>`;
                }).join(' ');

                return `
                    <div class="bg-white p-2.5 rounded-lg border border-gray-100 space-y-1">
                        <div class="flex justify-between items-center text-gray-700">
                            <span class="font-bold text-gray-800">${option} (${voters.length} người):</span>
                        </div>
                        <div class="flex flex-wrap gap-1 pt-1">
                            ${namesText}
                        </div>
                    </div>
                `;
            }).join('');

            container.innerHTML = html;
            document.getElementById('totalVotesBadge').innerText = `Tổng: ${totalVotes} lượt`;
        }

        function handleSelectOption(index) {
            if (!isPollOpen) return;
            selectedOptionIndex = index;
            renderOptions();
        }

        function submitVote() {
            if (!isPollOpen || selectedOptionIndex === null) return;

            if (!currentUser) {
                checkUserIdentity();
                return;
            }

            let votesData = getVotesData();

            votesData = votesData.map(voters => voters.filter(name => name !== currentUser));
            votesData[selectedOptionIndex].push(currentUser);

            saveVotesData(votesData);

            renderOptions();
            renderVotersDetail();

            alert(`Đã cập nhật bình chọn: "${pollSchedule.options[selectedOptionIndex]}"`);
        }

        // Chạy khởi tạo ứng dụng ngay lập tức
        initApp();
    </script>
</body>
</html>
